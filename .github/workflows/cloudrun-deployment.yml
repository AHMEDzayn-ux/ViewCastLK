name: Deploy Prediction API to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "prediction_api/**"
      - ".github/workflows/cloudrun-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prediction_api/requirements.txt

      - name: Test prediction API and model artifact
        working-directory: prediction_api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: viewcastlk
          workload_identity_provider: projects/932754937666/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: viewcastlk-github-deployer@viewcastlk.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: viewcastlk

      - name: Deploy prediction API
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}
        run: |
          gcloud run deploy viewcastlk-api \
            --project=viewcastlk \
            --source=prediction_api \
            --region=asia-south1 \
            --service-account=viewcastlk-api-runtime@viewcastlk.iam.gserviceaccount.com \
            --memory=1Gi \
            --cpu=1 \
            --min=0 \
            --max=1 \
            --port=8000 \
            --set-env-vars="GEMINI_MODEL=gemini-3.5-flash-lite,GEMINI_FALLBACK_MODELS=gemini-3.1-flash-lite;gemini-3.7-flash;gemini-3.6-flash;gemini-3.5-flash;gemini-3-flash-preview;gemini-2.5-flash;gemini-2.5-flash-lite,DASHBOARD_ORIGIN=https://viewcastlk.pages.dev,SUPABASE_URL=${SUPABASE_URL},SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY},GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI}" \
            --set-secrets="YOUTUBE_API_KEY=viewcastlk-youtube-api-key:latest,GEMINI_API_KEY=viewcastlk-gemini-api-key:latest,SUPABASE_AUTH_DB_URL=viewcastlk-supabase-auth-db-url:latest,SUPABASE_WAREHOUSE_DB_URL=viewcastlk-supabase-warehouse-db-url:latest,GOOGLE_OAUTH_CLIENT_ID=viewcastlk-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=viewcastlk-google-oauth-client-secret:latest,TOKEN_ENCRYPTION_KEY=viewcastlk-token-encryption-key:latest" \
            --quiet

      - name: Verify deployment health
        run: |
          SERVICE_URL="$(gcloud run services describe viewcastlk-api \
            --project=viewcastlk \
            --region=asia-south1 \
            --format='value(status.url)')"

          echo "Testing $SERVICE_URL/health"
          curl --fail --silent --show-error "$SERVICE_URL/health"
