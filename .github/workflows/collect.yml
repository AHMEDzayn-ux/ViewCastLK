name: Collect YouTube data

on:
  schedule:
    # Every 6 hours. GitHub's cron scheduler can be delayed under load, but
    # the 26h discovery lookback in run_daily_poll.py absorbs normal drift.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button, for testing/catch-up

jobs:
  poll:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run daily poll
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python run_daily_poll.py
