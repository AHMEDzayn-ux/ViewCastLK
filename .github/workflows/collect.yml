name: Collect YouTube data

on:
  schedule:
    # GitHub Actions cron is always UTC. 30 0,6,12,18 UTC = 12am/6am/12pm/6pm
    # Sri Lanka time (UTC+5:30). GitHub's scheduler can be delayed a few
    # minutes under load, but the 26h discovery lookback in run_daily_poll.py
    # absorbs that kind of normal drift.
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button, for testing/catch-up

jobs:
  poll:
    runs-on: ubuntu-latest
    # Everything runs from the repo root, not scripts/ - channel_handles.txt
    # and (for other scripts) output/ are root-relative, and every script
    # assumes that CWD. Running from scripts/ instead breaks those relative
    # paths (confirmed the hard way: FileNotFoundError on channel_handles.txt).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily poll
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/run_daily_poll.py
