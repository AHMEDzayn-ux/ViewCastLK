name: Collect YouTube data

on:
  schedule:
    # Every 6 hours. GitHub's cron scheduler can be delayed under load, but
    # the 26h discovery lookback in run_daily_poll.py absorbs normal drift.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button, for testing/catch-up

jobs:
  poll:
    runs-on: ubuntu-latest
    # Everything runs from the repo root, not scripts/ - channel_handles.txt
    # and (for other scripts) output/ are root-relative, and every script
    # assumes that CWD. Running from scripts/ instead breaks those relative
    # paths (confirmed the hard way: FileNotFoundError on channel_handles.txt).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily poll
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/run_daily_poll.py
