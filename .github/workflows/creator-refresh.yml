name: Refresh creator personalization

# Runs the refresh inside Google Cloud as a Cloud Run Job, from the image the
# live API is serving, with the API's runtime service account and the same
# Secret Manager secrets. The job needs exactly what the API needs (creator
# store, OAuth client, token key and the warehouse, whose channel history the
# calibration must see so it matches live forecasts), and none of those
# secrets exist as GitHub secrets, which is why the earlier in-runner version
# failed with "Creator storage is not configured."

on:
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: creator-personalization-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: viewcastlk
          workload_identity_provider: projects/932754937666/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: viewcastlk-github-deployer@viewcastlk.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: viewcastlk

      - name: Run the refresh with the live API's image and secrets
        run: |
          IMAGE="$(gcloud run services describe viewcastlk-api \
            --project=viewcastlk \
            --region=asia-south1 \
            --format='value(spec.template.spec.containers[0].image)')"
          echo "Using $IMAGE"

          gcloud run jobs deploy viewcastlk-creator-refresh \
            --project=viewcastlk \
            --region=asia-south1 \
            --image="$IMAGE" \
            --service-account=viewcastlk-api-runtime@viewcastlk.iam.gserviceaccount.com \
            --command=python \
            --args=-m,app.creator_refresh_job \
            --memory=1Gi \
            --cpu=1 \
            --max-retries=0 \
            --task-timeout=1800 \
            --set-secrets="SUPABASE_AUTH_DB_URL=viewcastlk-supabase-auth-db-url:latest,SUPABASE_WAREHOUSE_DB_URL=SUPABASE_WAREHOUSE_DB_URL:latest,GOOGLE_OAUTH_CLIENT_ID=viewcastlk-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=viewcastlk-google-oauth-client-secret:latest,TOKEN_ENCRYPTION_KEY=viewcastlk-token-encryption-key:latest" \
            --execute-now \
            --wait \
            --quiet
