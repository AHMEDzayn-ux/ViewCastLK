name: Refresh creator personalization

on:
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-personalization-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prediction_api/requirements.txt

      - name: Install prediction API dependencies
        working-directory: prediction_api
        run: pip install -r requirements.txt

      - name: Refresh connected creators
        working-directory: prediction_api
        env:
          SUPABASE_AUTH_DB_URL: ${{ secrets.SUPABASE_AUTH_DB_URL }}
          SUPABASE_WAREHOUSE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: python -m app.creator_refresh_job
