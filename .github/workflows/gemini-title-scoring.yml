name: Gemini title scoring batch proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gemini-title-scoring.yml"
      - "scripts/score_video_titles.py"
      - "scripts/score_video_titles_batch.py"
      - "tests/test_score_video_titles_batch.py"
  schedule:
    # Resume asynchronously without keeping a runner alive while Gemini works.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gemini-title-scoring
  cancel-in-progress: false

jobs:
  batch-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Batch proof components
        run: python -m unittest discover -s tests -p "test_score_video_titles_batch.py" -v

      - name: Submit or poll the 100-title proof
        id: batch
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python scripts/score_video_titles_batch.py run
          --limit 100

      - name: Commit Batch proof state and scores
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Dataset/title_scores.csv
          if [[ -f Dataset/title_batch_proof_state.json ]]; then
            git add -- Dataset/title_batch_proof_state.json
          fi

          if git diff --cached --quiet; then
            echo "No Batch proof progress to commit."
            exit 0
          fi

          git commit -m "data: checkpoint Gemini Batch title-scoring proof"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report Batch proof failure
        if: ${{ steps.batch.outcome == 'failure' }}
        run: exit 1
